[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mumbai-uhi-platform"
version = "0.1.0"
description = "AI-Driven Spatiotemporal Modeling and Downscaling of Urban Heat Island Dynamics in Metropolitan Mumbai"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hussain", email = "lead@mumbai-uhi.local" },
    { name = "Asad" },
    { name = "Abdulrehman" },
    { name = "Ahmed" }
]
dependencies = [
    # Remote Sensing & Geospatial
    "earthengine-api>=0.1.380",
    "geemap>=0.32.0",
    "rasterio>=1.3.8",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    
    # Data Engineering & Numerical
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "xarray>=2023.6.0",
    "pyarrow>=14.0.0",

    # Machine Learning & Explainability
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "shap>=0.44.0",
    "pysal>=24.1",
    "esda>=2.5.0",

    # Deep Learning Benchmark
    "torch>=2.1.0",
    "torchvision>=0.16.0",

    # Backend Microservice
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",

    # Frontend UI
    "streamlit>=1.32.0",
    "pydeck>=0.8.0",

    # Reporting & Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "reportlab>=4.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
